<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Magic Studio</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.2rem;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .workspace {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .panel {
            flex: 1;
            min-width: 300px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
        }

        .upload-box {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            border-color: #3b82f6;
            background: #f0f9ff;
        }

        .folder-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .upload-content p {
            font-size: 0.95rem;
            color: #475569;
        }

        .upload-content span {
            font-size: 0.8rem;
            color: #94a3b8;
            display: block;
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease, opacity 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: #10b981;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #059669;
        }

        .btn-download {
            background-color: #8b5cf6;
            color: white;
            margin-top: 15px;
        }

        .btn:disabled {
            background-color: #cbd5e1;
            color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #e2e8f0;
            z-index: 1;
        }

        .divider span {
            background: #f9fafb;
            padding: 0 10px;
            color: #64748b;
            font-size: 0.85rem;
            position: relative;
            z-index: 2;
        }

        .text-edit-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .text-edit-section label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
        }

        .text-edit-section input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .image-card {
            margin-bottom: 20px;
        }

        .image-card h3 {
            font-size: 1.05rem;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .image-wrapper {
            width: 100%;
            height: 220px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .hidden {
            display: none !important;
        }

        .spinner-container {
            text-align: center;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>✨ AI Photo Magic Studio</h1>
            <p>Upload your photo, enhance it to HD, or edit it using custom AI prompts!</p>
        </header>

        <main class="workspace">
            <section class="panel controls-panel">
                <div class="upload-box" id="drop-zone">
                    <input type="file" id="image-input" accept="image/*" hidden>
                    <div class="upload-content">
                        <div class="folder-icon">📂</div>
                        <p><strong>Click to upload</strong> or drag & drop</p>
                        <span>PNG, JPG, WEBP (Max 16MB)</span>
                    </div>
                </div>

                <button id="hd-btn" class="btn btn-primary" disabled>
                    🚀 Make HD Quality
                </button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="text-edit-section">
                    <label for="prompt-input">Text Prompt Modification:</label>
                    <input type="text" id="prompt-input" placeholder="e.g., Make it sunset background, add sunglasses..." disabled>
                    <button id="edit-btn" class="btn btn-secondary" disabled>
                        🎨 Apply AI Edit
                    </button>
                </div>
            </section>

            <section class="panel preview-panel">
                <div class="image-card">
                    <h3>Original Image</h3>
                    <div class="image-wrapper" id="original-wrapper">
                        <p class="placeholder-text">No image uploaded</p>
                        <img id="original-img" src="" alt="Original Preview" class="hidden">
                    </div>
                </div>

                <div class="image-card">
                    <h3>AI Output</h3>
                    <div class="image-wrapper" id="output-wrapper">
                        <p class="placeholder-text">Result will appear here</p>
                        <img id="output-img" src="" alt="AI Result" class="hidden">
                        
                        <div id="loading-spinner" class="spinner-container hidden">
                            <div class="spinner"></div>
                            <p id="loading-text">AI is working its magic...</p>
                        </div>
                    </div>
                    
                    <a id="download-btn" class="btn btn-download hidden" download="ai-photo.png">
                        📥 Download HD Image
                    </a>
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
