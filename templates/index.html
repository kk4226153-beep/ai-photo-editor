<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Magic Studio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>✨ AI Photo Magic Studio</h1>
            <p>Upload your photo, enhance it to HD, or edit it using custom AI prompts!</p>
        </header>

        <main class="workspace">
            <section class="panel controls-panel">
                <div class="upload-box" id="drop-zone">
                    <input type="file" id="image-input" accept="image/*" hidden>
                    <div class="upload-content">
                        <div class="folder-icon">📂</div>
                        <p><strong>Click to upload</strong> or drag & drop</p>
                        <span>PNG, JPG, WEBP (Max 16MB)</span>
                    </div>
                </div>

                <button id="hd-btn" class="btn btn-primary" disabled>
                    🚀 Make HD Quality
                </button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="text-edit-section">
                    <label for="prompt-input">Text Prompt Modification:</label>
                    <input type="text" id="prompt-input" placeholder="e.g., Make it sunset background, add sunglasses..." disabled>
                    <button id="edit-btn" class="btn btn-secondary" disabled>
                        🎨 Apply AI Edit
                    </button>
                </div>
            </section>

            <section class="panel preview-panel">
                <div class="image-card">
                    <h3>Original Image</h3>
                    <div class="image-wrapper" id="original-wrapper">
                        <p class="placeholder-text">No image uploaded</p>
                        <img id="original-img" src="" alt="Original Preview" class="hidden">
                    </div>
                </div>

                <div class="image-card">
                    <h3>AI Output</h3>
                    <div class="image-wrapper" id="output-wrapper">
                        <p class="placeholder-text">Result will appear here</p>
                        <img id="output-img" src="" alt="AI Result" class="hidden">
                        
                        <div id="loading-spinner" class="spinner-container hidden">
                            <div class="spinner"></div>
                            <p id="loading-text">AI is working its magic...</p>
                        </div>
                    </div>
                    
                    <a id="download-btn" class="btn btn-download hidden" download="ai-photo.png">
                        📥 Download HD Image
                    </a>
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
